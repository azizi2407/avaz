# Bu depo bir Claude Code plugin'idir, bir Python dağıtımı değil: pip ile
# kurulacak bir paket içermez. Dosya yalnızca araç yapılandırması taşır.
# Geliştirme bağımlılıkları requirements-dev.txt içinde.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
src = ["plugins/avaz/skills/avaz/scripts", "tests"]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
