[project]
name = "avaz-tools"
version = "1.1.0"
description = "Avaz skill'inin çözümleme betiği ve testleri"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
src = ["plugins/avaz/skills/avaz/scripts", "tests"]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
